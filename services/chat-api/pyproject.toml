[tool.poetry]
name = "movo-chat-api"
version = "0.1.0"
description = "Backend for the MOVO agent platform"
authors = ["MOVO Team"]

[tool.poetry.dependencies]
python = "^3.10"
# Compatibility metadata only. backend/requirements.txt is the canonical
# runtime dependency source used by Docker and deployment.
fastapi = "^0.109.0"
firecrawl-py = ">=4.6.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
httpx = "^0.26.0"
openai = "^2.8.1"
python-multipart = "^0.0.9"
pyyaml = "^6.0.2"
requests = "^2.32.0"
python-docx = "^1.1.2"
python-pptx = ">=0.6.21"
openpyxl = "^3.1.2"
xlrd = "^2.0.1"
pdfplumber = ">=0.11.0"
pypdf = ">=4.0.0"
motor = "2.5.1"
pymongo = "3.12.3"
oss2 = "^2.19.1"
markdown-it-py = "^4.0.0"
dashscope = ">=1.15.0"
playwright = "^1.56.0"
trafilatura = "^2.0.0"
tushare = ">=1.4.24"
tabulate = "^0.9.0"
aiofiles = "^23.2.1"
tenacity = ">=8.3.0"
pandas = ">=2.0.0"
beautifulsoup4 = ">=4.12.0"
lxml = "^6.0.0"
pillow = "^12.0.0"
dateparser = "^1.2.0"
google-search-results = "^2.4.2"
tavily-python = ">=0.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.1.0"
isort = "^5.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
