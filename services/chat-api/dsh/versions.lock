# ASKAI DSH dependency lock policy (format 1)
# Generated during migration step 1 on 2026-08-15.
# This file records approved direct artifacts. Step 2 must create pnpm-lock.yaml
# and verify every transitive package against the same release train.

[upstream]
repository = "https://github.com/deepseek-ai/deepseek-harness"
reviewed_commit = "0a53fb55bea101816fa226bb964ae2bed71c343b"
reviewed_commit_root_version = "0.1.2-alpha.2"
default_branch = "master"
deploy_from_branch = false
allow_floating_versions = false

# npm metadata does not expose a verified source commit mapping for the
# installable release train, so source-to-package provenance remains explicitly
# unverified until DeepSeek publishes that mapping.
[release_train]
version = "0.1.2-alpha.2"
source_mapping = "unverified-by-upstream"
policy = "all @deepseek-ai/dsh and @deepseek-ai/dsh-* packages must resolve exactly to 0.1.2-alpha.2"

