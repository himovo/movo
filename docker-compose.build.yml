services:
  sandbox-script:
    pull_policy: build
    build:
      context: ./services/chat-api
      dockerfile: Dockerfile.sandbox-script
      args:
        MOVO_PIP_INDEX_URL: ${MOVO_PIP_INDEX_URL:-}
        MOVO_APT_MIRROR: ${MOVO_APT_MIRROR:-}

  sandbox-manager:
    pull_policy: build
    build:
      context: ./services/sandbox-manager
      dockerfile: Dockerfile
      args:
        MOVO_PIP_INDEX_URL: ${MOVO_PIP_INDEX_URL:-}

  deployment-observer:
    pull_policy: build
    build:
      context: ./services/sandbox-manager
      dockerfile: Dockerfile
      args:
        MOVO_PIP_INDEX_URL: ${MOVO_PIP_INDEX_URL:-}

  sandbox-egress:
    pull_policy: build
    build:
      context: ./services/sandbox-egress
      dockerfile: Dockerfile

  dsh-runtime-host:
    pull_policy: build
    build:
      context: ./services/chat-api/dsh/runtime-host
      dockerfile: Dockerfile

  chat-api:
    pull_policy: build
    build:
      context: ./services/chat-api
      dockerfile: Dockerfile
      args:
        MOVO_SOURCE_REVISION: ${MOVO_SOURCE_REVISION:-}
        MOVO_SOURCE_VERSION: ${MOVO_SOURCE_VERSION:-}
        INSTALL_SYSTEM_DEPS_AT_BUILD: "true"
        INSTALL_PLAYWRIGHT_AT_BUILD: "true"
        PLAYWRIGHT_WITH_DEPS: "true"

  admin-api:
    pull_policy: build
    build:
      context: ./services/admin-api
      dockerfile: Dockerfile

  document-api:
    pull_policy: build
    build: &document-build
      context: ./services/document-parser
      dockerfile: Dockerfile
      args:
        INSTALL_SYSTEM_DEPS_AT_BUILD: "true"
        INSTALL_PYTHON_DEPS_AT_BUILD: "true"
        INSTALL_DOCLING_MODELS_AT_BUILD: "true"
        PYTORCH_ACCELERATOR: cpu

  document-worker:
    pull_policy: build
    build: *document-build

  user-web:
    pull_policy: build
    build:
      context: ./apps/user-web
      dockerfile: Dockerfile.prod
      args:
        VITE_ADMIN_WEB_URL: /admin/

  admin-web:
    pull_policy: build
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /admin/
        VITE_ADMIN_API_BASE_URL: /admin-api

  gateway:
    pull_policy: build
    build:
      context: ./deploy/docker
      dockerfile: gateway.Dockerfile
