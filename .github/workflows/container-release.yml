name: Container Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate publication boundary
        run: python scripts/check_open_source_hygiene.py
      - name: Validate Compose variants
        env:
          MOVO_IMAGE_PREFIX: ghcr.io/example/movo
          MOVO_VERSION: ${{ github.ref_name }}
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet

  publish:
    needs: validate-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: dsh-runtime-host
            context: services/chat-api/dsh/runtime-host
            dockerfile: services/chat-api/dsh/runtime-host/Dockerfile
            build_args: ""
          - suffix: chat-api
            context: services/chat-api
            dockerfile: services/chat-api/Dockerfile
            build_args: |
              INSTALL_SYSTEM_DEPS_AT_BUILD=true
              INSTALL_PLAYWRIGHT_AT_BUILD=true
              PLAYWRIGHT_WITH_DEPS=true
          - suffix: admin-api
            context: services/admin-api
            dockerfile: services/admin-api/Dockerfile
            build_args: ""
          - suffix: document-parser
            context: services/document-parser
            dockerfile: services/document-parser/Dockerfile
            build_args: |
              INSTALL_SYSTEM_DEPS_AT_BUILD=true
              INSTALL_PYTHON_DEPS_AT_BUILD=true
              INSTALL_DOCLING_MODELS_AT_BUILD=true
              PYTORCH_ACCELERATOR=cpu
          - suffix: user-web
            context: apps/user-web
            dockerfile: apps/user-web/Dockerfile.prod
            build_args: VITE_ADMIN_WEB_URL=/admin/
          - suffix: admin-web
            context: apps/admin-web
            dockerfile: apps/admin-web/Dockerfile
            build_args: |
              VITE_BASE_PATH=/admin/
              VITE_ADMIN_API_BASE_URL=/admin-api
    steps:
      - uses: actions/checkout@v7
      - name: Normalize image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
