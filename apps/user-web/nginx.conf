server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF.js loads its worker as an ES module. Serve .mjs explicitly so
    # Chromium does not reject the worker as application/octet-stream.
    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
