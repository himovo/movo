server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PDF.js ships its worker as an ES module. Alpine Nginx does not map the
    # .mjs extension by default, so browsers reject it when it is served as
    # application/octet-stream.
    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
